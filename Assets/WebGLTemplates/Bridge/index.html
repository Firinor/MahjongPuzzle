<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="preconnect" href="https://bridge.playgama.com">
    <link rel="preload" href="Build/{{{ CODE_FILENAME }}}" as="fetch" type="application/wasm" crossorigin>
    <link rel="preload" href="Build/{{{ DATA_FILENAME }}}" as="fetch" crossorigin>
    <link rel="preload" href="Build/{{{ FRAMEWORK_FILENAME }}}" as="script">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #8CB78F;
        }

        .canvas-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(100%, calc(100vh * 16 / 9));
            height: min(100%, calc(100vw * 9 / 16));
        }

        #canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            background: #242424;
        }
    </style>
</head>
<body>
<div class="canvas-wrapper">
    <canvas id="canvas"></canvas>
</div>
<script src="./playgama-bridge-unity.js"></script>
</body>
</html>
